<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Elden Ring — Интерактивная карта (.co2)</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="vendor/leaflet/MarkerCluster.css" />
<link rel="stylesheet" href="vendor/leaflet/MarkerCluster.Default.css" />
<link rel="stylesheet" href="coop-sync.css" />
<style>
  :root{
    --bg:#0f1217; --panel:#161a22; --panel2:#1e2430; --line:#2b3342;
    --text:#eaeef5; --muted:#95a2b8; --accent:#d9a94e; --accent-hi:#f0cf88; --good:#5fb878;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  #app{display:flex;height:100%}

  #sidebar{width:336px;min-width:336px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;transition:margin-left .25s}
  #app.sb-collapsed #sidebar{margin-left:-336px}
  .brand{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(217,169,78,.09),transparent)}
  .brand::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(217,169,78,.55),transparent);pointer-events:none}
  .brand-main{min-width:0}
  .brand h1{margin:0;font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;font-size:18px;letter-spacing:1.4px;color:var(--accent-hi);font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .brand p{margin:2px 0 0;font-size:10.5px;color:var(--muted);letter-spacing:.35px}
  .tools{padding:9px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .maptabs{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px;gap:3px}
  .maptab{flex:1;text-align:center;padding:6px 4px;font-size:11px;white-space:nowrap;color:var(--muted);border-radius:5px;cursor:pointer;transition:.15s}
  .maptab:hover{color:var(--text)}
  .maptab.active{background:var(--accent);color:#1a1206;font-weight:700}
  .search{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;transition:border-color .15s}
  .search:focus-within{border-color:var(--accent)}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:12.5px}
  .search input::placeholder{color:var(--muted)}
  .row{display:flex;gap:8px}
  .btn{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:6px 7px;font-size:11px;cursor:pointer;transition:.15s;text-align:center;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--text)}
  .btn.active{background:var(--accent);color:#1a1206;border-color:var(--accent);font-weight:700}
  .cats{flex:1;min-height:0;overflow-y:auto;padding:6px 8px 20px}
  .cats::-webkit-scrollbar{width:7px}
  .cats::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .cats::-webkit-scrollbar-thumb:hover{background:#3c475c}
  .group-h{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--accent);opacity:.85;padding:10px 8px 4px;font-weight:600}
  .cat{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;cursor:pointer;user-select:none;transition:background .12s,opacity .15s}
  .cat:hover{background:var(--panel2)}
  .cat.off{opacity:.4}
  .cat .ic{width:23px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .cat .nm{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
  .cat .ct b{color:var(--good)}

  #map{flex:1;height:100%;background:#070809;cursor:grab;--pin-scale:1}
  #map:active{cursor:grabbing}
  .leaflet-container{background:#070809}
  #togglebar{position:absolute;top:12px;left:348px;z-index:1000;display:flex;align-items:center;flex-wrap:wrap;gap:7px;max-width:calc(100% - 370px);transition:left .25s}
  #app.sb-collapsed #togglebar{left:12px;max-width:calc(100% - 24px)}
  .iconbtn{background:rgba(22,26,34,.92);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent-hi)}

  .pin{display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #0d0f13;box-shadow:0 1px 4px rgba(0,0,0,.65);font-size:13px;transform:scale(var(--pin-scale,1));transition:transform .15s ease}
  .pin:hover{transform:scale(calc(var(--pin-scale,1) * 1.25));z-index:9999}
  .pin.done{filter:grayscale(1) brightness(.7);opacity:.7}
  .qpin{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #0d0f13;box-shadow:0 1px 4px rgba(0,0,0,.6)}
  .qpin span{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700}
  .qpin.start{box-shadow:0 0 0 3px rgba(229,72,77,.45),0 1px 6px rgba(0,0,0,.7);z-index:9999}
  .qpin.start span{font-size:13px}
  .region-label{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;color:#efe2c4;font-size:13.5px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;text-shadow:0 1px 3px #000,0 0 8px #000,0 0 8px #000;pointer-events:none;opacity:var(--rl-op,.92);transition:opacity .25s}
  .quest-row .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .quest-row.off{opacity:.45}

  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border-radius:10px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.65)}
  .leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}
  .leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.5}
  .pop-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin-bottom:3px}
  .pop-t{font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;font-size:15.5px;font-weight:700;color:#f5ebd6;margin-bottom:5px}
  .pop-d{color:var(--muted);margin-bottom:9px}
  .pop-found{display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px}
  .pop-found.on{border-color:var(--good);color:var(--good)}
  .pop-head{display:flex;gap:9px;align-items:flex-start;margin-bottom:6px}
  .pop-icon{width:44px;height:44px;border-radius:6px;background:var(--panel2);object-fit:contain;flex-shrink:0;image-rendering:auto}
  .pop-head-t{flex:1;min-width:0}
  .pop-stat{font-size:11.5px;color:#d7b471;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin:0 0 5px}
  .pop-stat b{color:#f0e3c4;font-weight:700}
  .pop-deals{color:#eaa99e;border-color:#5a302b;background:#2a1a17}
  .pop-deals b{color:#ffb4a6}
  .pop-weak{color:#a9d9a6;border-color:#2f5a32;background:#172a18}
  .pop-weak b{color:#b9f0b0}
  .pop-resist{color:#9aa3ad;border-color:#363b43;background:#1b1e23}
  .pop-resist b{color:#c4ccd6}
  .pop-tag{color:var(--muted);font-size:10px;margin-left:4px}
  .pop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:0 0 5px}
  .pop-grid div{display:flex;flex-direction:column;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 2px;font-size:9.5px;color:var(--muted);line-height:1.3}
  .pop-grid div b{color:#e7d9b8;font-size:11.5px;font-weight:700}
  .pop-sum{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.45}
  .pop-actions{display:flex;gap:8px;align-items:stretch}
  .pop-actions .pop-found{flex:1}
  .pop-wiki{display:flex;align-items:center;font-size:11.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:0 11px;white-space:nowrap}
  .pop-wiki:hover{border-color:var(--accent);color:var(--accent)}
  .leaflet-popup-close-button{color:var(--muted)!important}

  #coord{position:absolute;bottom:12px;right:12px;z-index:1000;background:rgba(22,26,34,.92);border:1px solid var(--line);color:#e8dcb9;font-size:11.5px;padding:5px 10px;border-radius:7px;pointer-events:none;backdrop-filter:blur(6px);box-shadow:0 4px 12px rgba(0,0,0,.45)}
  #coord:empty{display:none}

  /* Completion dashboard */
  .dash{padding:10px 18px 12px;border-bottom:1px solid var(--line)}
  .dash-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
  .dash-top b{color:var(--good)}
  .dash-bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .dash-bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));width:0;transition:width .35s}
  .dash-sub{font-size:10.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

  /* Search results dropdown */
  .search-wrap{position:relative}
  .results{display:none;margin-top:4px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;max-height:280px;overflow-y:auto}
  .results::-webkit-scrollbar{width:7px}.results::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .res{display:flex;align-items:center;gap:9px;padding:7px 9px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--line)}
  .res:last-child{border-bottom:none}
  .res:hover{background:var(--panel)}
  .res-ic{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .res-nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res-cat{font-size:10px;color:var(--muted);flex-shrink:0}
  .res-empty{padding:9px;font-size:12px;color:var(--muted)}

  /* Cluster bubbles themed to the app */
  .marker-cluster{background:rgba(217,164,65,.25)}
  .marker-cluster div{background:rgba(217,164,65,.85);color:#1a1206;font-weight:700;font-family:inherit}

  /* Quest tracker */
  .qpin.done{filter:grayscale(.6) brightness(.8);opacity:.6}
  .qpin.current{box-shadow:0 0 0 3px rgba(217,164,65,.6),0 0 11px rgba(217,164,65,.55);z-index:9000}
  .qpin.warn{border-color:#e5a23a}
  .pop-warn{font-size:12px;color:#e7ad4e;background:rgba(229,162,58,.12);border-left:2px solid #e5a23a;padding:5px 8px;border-radius:0 5px 5px 0;margin-bottom:8px;line-height:1.4}
  #questPanel{--qfs:1;position:absolute;top:12px;right:12px;width:360px;max-height:calc(100% - 24px);z-index:1100;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:none;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.55)}
  #questPanel.open{display:flex}
  .qp-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .qp-title{display:flex;align-items:center;gap:8px;font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;font-size:calc(15.5px*var(--qfs));font-weight:700;color:#f5ebd6;flex:1;min-width:0}
  .qp-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .qp-x{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 7px;border-radius:5px}
  .qp-x:hover{color:var(--text);background:var(--panel2)}
  .qp-tools{display:flex;align-items:center;gap:5px;flex-shrink:0}
  .qp-fs{cursor:pointer;color:var(--muted);font-size:12px;font-weight:700;line-height:1;padding:3px 7px;border-radius:5px;border:1px solid var(--line);user-select:none}
  .qp-fs:hover{color:var(--text);background:var(--panel2);border-color:var(--accent)}
  .qp-resize{position:absolute;left:-3px;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:5;border-radius:8px}
  .qp-resize:hover,.qp-resize:active{background:linear-gradient(90deg,rgba(217,164,65,.55),transparent)}
  .qp-prog{padding:10px 14px;border-bottom:1px solid var(--line)}
  .qp-prog-top{display:flex;justify-content:space-between;font-size:calc(11.5px*var(--qfs));color:var(--muted);margin-bottom:5px}
  .qp-prog-top b{color:var(--good)}
  .qp-steps{flex:1;min-height:0;overflow-y:auto;padding:6px}
  .qp-steps::-webkit-scrollbar{width:7px}.qp-steps::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .qs-row{display:flex;align-items:flex-start;gap:9px;padding:8px;border-radius:7px;cursor:pointer}
  .qs-row:hover{background:var(--panel2)}
  .qs-row.cur{background:rgba(217,164,65,.1);box-shadow:inset 0 0 0 1px rgba(217,164,65,.4)}
  .qs-row.done .qs-t{text-decoration:line-through;color:var(--muted)}
  .qs-chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--good);margin-top:1px}
  .qs-chk:hover{border-color:var(--good)}
  .qs-chk.on{border-color:var(--good);background:rgba(95,184,120,.18)}
  .qs-num{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;margin-top:1px}
  .qs-body{flex:1;min-width:0}
  .qs-t{font-size:calc(13.5px*var(--qfs));line-height:1.4}
  .qs-warn{color:#e5a23a}
  .qs-warntext{font-size:calc(12px*var(--qfs));color:#e7b75f;margin-top:4px;line-height:1.45;background:rgba(229,162,58,.1);border-left:2px solid #e5a23a;padding:4px 7px;border-radius:0 4px 4px 0}
  .qs-desc{font-size:calc(13px*var(--qfs));color:var(--text);opacity:.86;margin-top:4px;line-height:1.5}
  .qs-row.done .qs-desc{opacity:.5}
  .qp-notes{margin:2px 4px 9px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;font-size:calc(13px*var(--qfs));color:var(--text);opacity:.9;line-height:1.6}
  .qp-notes-h{font-size:calc(10.5px*var(--qfs));text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin-bottom:5px}
  .qp-prereq{margin-top:8px;padding:6px 9px;font-size:calc(12px*var(--qfs));color:#e7b75f;background:rgba(229,162,58,.1);border-left:2px solid #e5a23a;border-radius:0 4px 4px 0;line-height:1.5}
  .qs-reward{font-size:calc(12px*var(--qfs));color:#9fd0a0;margin-top:4px;line-height:1.45}
  .qs-row.done .qs-reward{opacity:.6}
  .qs-layer{font-size:9px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 5px;white-space:nowrap;align-self:center}
  @media(max-width:640px){
    #sidebar{position:absolute;z-index:1100;height:100%}
    #questPanel{width:auto!important;left:0;right:0;bottom:0;top:auto;height:50%;max-height:50%;border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.5)}
    .qp-resize{display:none}
    #togglebar{left:auto;right:10px;z-index:1200}
    #app.sb-collapsed #togglebar{left:10px;right:auto}
    #coord{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-main">
        <h1>ELDEN RING</h1>
        <p>Интерактивная карта · Seamless Co-op (.co2)</p>
      </div>
      <div class="brand-menu-wrap">
        <button type="button" class="gear-btn" id="settingsBtn" title="Настройки, экспорт и сброс">⚙</button>
        <div class="gear-menu" id="settingsMenu">
          <button type="button" class="gear-item" id="exportBtn">📤 Экспорт прогресса</button>
          <button type="button" class="gear-item" id="importBtn">📥 Импорт прогресса</button>
          <button type="button" class="gear-item" id="shareBtn">🔗 Ссылка на позицию</button>
          <div class="gear-sep"></div>
          <button type="button" class="gear-item danger" id="reset">🗑 Сбросить отметки</button>
        </div>
        <input type="file" id="importFile" accept="application/json" style="display:none">
      </div>
    </div>
    <div class="coop-box" id="coopBox">
      <div class="coop-head">
        <div class="coop-status"><span class="coop-dot" id="coopDot"></span><span id="coopStatusText">Подключение к .co2…</span></div>
        <button class="coop-toggle on" id="coopToggleBtn" type="button">Авто: ВКЛ</button>
      </div>
      <div class="coop-meta" id="coopMeta"><span>Ожидание сохранения…</span><span></span></div>
      <div class="coop-controls">
        <select class="coop-select" id="coopFileSel" title="Файл сохранения (.co2 / .sl2)"></select>
        <select class="coop-select" id="coopSlotSel" title="Слот персонажа" style="max-width:130px"></select>
      </div>
      <div class="coop-actions">
        <div class="btn" id="coopLocate" title="Показать текущую позицию персонажа на карте">📍 Где я</div>
        <div class="btn" id="coopGracesOnly" title="Оставить на карте только точки благодати и названия регионов">🔥 Благодати</div>
        <div class="btn" id="coopSyncNow" title="Перечитать сохранение вручную">↻ Обновить</div>
      </div>
      <div class="coop-world" id="coopWorld"></div>
    </div>
    <div class="dash">
      <div class="dash-top"><span>Прогресс</span><span><b id="dashPct">0%</b></span></div>
      <div class="dash-bar"><div id="dashFill"></div></div>
      <div class="dash-sub" id="dashSub">🔥 0/0 · 💀 0/0</div>
    </div>
    <div class="tools">
      <div class="maptabs" id="maptabs">
        <div class="maptab active" data-base="M00">Междуземье</div>
        <div class="maptab" data-base="M01">Подземелья</div>
        <div class="maptab" data-base="M10">Земли Теней</div>
      </div>
      <div class="search-wrap">
        <div class="search">
          <span style="color:var(--muted);margin-right:7px">🔍</span>
          <input id="search" placeholder="Поиск локаций, благодати, боссов, предметов…" autocomplete="off">
        </div>
        <div id="results" class="results"></div>
      </div>
    </div>
    <div class="sb-tabs" id="sbTabs">
      <button type="button" class="sb-tab active" data-tab="markers">📍 Метки</button>
      <button type="button" class="sb-tab" data-tab="quests">📜 Квесты <span class="sb-tab-ct" id="sbQuestCt"></span></button>
      <button type="button" class="sb-tab" data-tab="regions">🗺 Регионы</button>
    </div>
    <div class="sb-pane active" id="pane-markers">
      <div class="pane-bar">
        <div class="btn" id="allOn">Показать все</div>
        <div class="btn" id="allOff">Скрыть все</div>
        <div class="btn" id="hideFound">Скрыть найденное</div>
      </div>
      <div class="cats" id="cats"></div>
    </div>
    <div class="sb-pane" id="pane-quests">
      <div class="cats" id="questCats"></div>
    </div>
    <div class="sb-pane" id="pane-regions">
      <div class="reg-active-strip" id="regActiveStrip"></div>
      <div class="cats reg-list" id="regionPanel"></div>
    </div>
  </aside>

  <div id="map"></div>
  <div id="togglebar">
    <button class="iconbtn" id="sbToggle" title="Скрыть/показать панель">☰</button>
    <div id="mapFilterChips" class="map-chips"></div>
  </div>
  <div id="coord"></div>
  <div id="questPanel"></div>
  <div id="coopToasts"></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/leaflet/leaflet.markercluster.js"></script>
<script src="markers.js"></script>
<script src="bossdata.js"></script>
<script src="quests.js"></script>
<script src="itemdata.js" defer></script>
<script>
/* ============================================================
   Base map = datamined Elden Ring master tiles (10496x10496),
   served locally from ./ctiles. Markers carry master-pixel (px,py)
   coordinates that map EXACTLY onto these tiles (1px = 1 game unit).
   ============================================================ */
const CONFIG = {
  tileUrl:  "ctiles/{map}/base/{z}/{y}/{x}.webp",  // note path order z/y/x
  tileSize: 256,
  nativeZoom: 6,        // ceil(log2(10496/256))
  imgSize: 10496,
};
const NZ = CONFIG.nativeZoom, SCALE = Math.pow(2, NZ);   // 64
// master-pixel (px,py) <-> CRS.Simple latlng (leaflet-rastercoords math)
const xy = (px, py) => L.latLng(-py / SCALE, px / SCALE);
const fromLatLng = ll => [ Math.round(ll.lng * SCALE), Math.round(-ll.lat * SCALE) ];

const bounds = L.latLngBounds(xy(0, CONFIG.imgSize), xy(CONFIG.imgSize, 0));

const map = L.map("map", {
  crs: L.CRS.Simple,
  minZoom: 1,
  maxZoom: NZ + 1,
  zoomControl: false,
  attributionControl: false,
  maxBounds: bounds.pad(0.2),
  maxBoundsViscosity: 0.7,
  zoomSnap: 0.25,
  zoomDelta: 0.5,
});
L.control.zoom({ position: "bottomleft" }).addTo(map);

const makeTiles = master => L.tileLayer(CONFIG.tileUrl.replace("{map}", master), {
  tileSize: CONFIG.tileSize,
  minNativeZoom: 0,
  maxNativeZoom: NZ,
  noWrap: true,
  bounds: bounds,
  updateWhenZooming: false,   // don't fetch tiles mid zoom-animation -> smoother zoom
  updateWhenIdle: true,       // defer tile loading until the drag stops -> smoother panning
  keepBuffer: 3,              // keep a wider ring of tiles so the deferred load isn't visible

});
const baseLayers = { M00: makeTiles("M00"), M01: makeTiles("M01"), M10: makeTiles("M10") };
let activeBase = "M00";
baseLayers.M00.addTo(map);
map.fitBounds(bounds);

function switchBase(base){
  if (base === activeBase || !baseLayers[base]) return;
  map.removeLayer(baseLayers[activeBase]);
  activeBase = base;
  activeRegion = null;
  buildMasterMarkers(base);                 // lazily build this map's markers on first visit
  baseLayers[base].addTo(map);
  baseLayers[base].bringToBack();
  document.querySelectorAll(".maptab").forEach(t => t.classList.toggle("active", t.dataset.base === base));
  rebuildCluster();
  refreshCounts();
  if (typeof renderActiveQuests === "function") renderActiveQuests();
  if (typeof window._onBaseSwitch === "function") window._onBaseSwitch(base);
}
document.querySelectorAll(".maptab").forEach(t => t.onclick = () => switchBase(t.dataset.base));

function pinHtml(cat, isDone, d){
  const condTag = (d && d.cond) ? `<span class="pin-cond" title="${d.cond}">🌙</span>` : "";
  return `<div class="pin ${isDone?'done':''}" style="background:${cat.color};width:24px;height:24px">${cat.icon}${condTag}</div>`;
}
function divIcon(cat, isDone, d){
  return L.divIcon({ html: pinHtml(cat, isDone, d), className:"", iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-14] });
}

function regionIcon(name){
  return L.divIcon({ html:`<div class="region-label">${name}</div>`, className:"", iconSize:[0,0], iconAnchor:[0,0] });
}
function makeMarker(d){
  const cat = catById[d.cat];
  const isRegion = d.cat === "region";
  const m = isRegion
    ? L.marker(xy(d.px, d.py), { icon: regionIcon(d.name), interactive:false, keyboard:false })
    : L.marker(xy(d.px, d.py), { icon: divIcon(cat, isMarkerFound(d.id), d), title: d.cond ? `${d.name} (🌙 ${d.cond})` : d.name });
  if(!isRegion){
    m.bindPopup(() => popupHtml(d, cat), { closeButton:true, minWidth: 220 });
    m.on("popupopen", () => bindPopup(d, cat, m));
  }
  const ref = { marker:m, data:d, cat, master:d.master, isRegion };
  markerRefs.push(ref);
  return ref;
}
const DMG_ICON = { physical:"🗡️", strike:"🔨", slash:"🪓", pierce:"🏹", magic:"🔮", fire:"🔥", lightning:"⚡", holy:"✨", bleed:"🩸", frostbite:"❄️", poison:"🟣", "scarlet rot":"🦠", madness:"🌀", sleep:"💤", death:"💀" };
const DMG_LABEL = { physical:"Физический", strike:"Дробящий", slash:"Рубящий", pierce:"Колющий", magic:"Магия", fire:"Огонь", lightning:"Молния", holy:"Святой", bleed:"Кровотечение", frostbite:"Обморожение", poison:"Яд", "scarlet rot":"Алая гниль", madness:"Безумие", sleep:"Сон", death:"Смерть" };
function dmgChips(arr){ return (arr||[]).map(k => `${DMG_ICON[k]||"•"} ${DMG_LABEL[k]||k}`).join(" · "); }
function bossInfo(name){ if(!window.BOSS_INFO) return null; return BOSS_INFO[name] || BOSS_INFO[name.replace(/\s*\(.*\)$/, "")] || null; }
function itemMeta(d, catId){
  const key = d.en || d.name;
  const data = (window.ITEMDATA && window.ITEMDATA[catId]) ? (window.ITEMDATA[catId][key] || window.ITEMDATA[catId][d.name]) : null;
  let iconHtml="", statHtml="", sumHtml="";
  const wt = v => (Math.round(v*10)/10);
  const stat = s => `<div class="pop-stat">${s}</div>`;
  if(data){
    if(data.icon) iconHtml = `<img class="pop-icon" src="icons/${data.icon}.webp" onerror="this.remove()">`;
    if(catId==='weapon'){
      const tags=[]; if(data.inf) tags.push('Пепел'); if(data.buf) tags.push('Чары/смазка'); if(data.som) tags.push('Мрак');
      let l1 = [data.t, data.wt!=null?('Вес '+wt(data.wt)):null].filter(Boolean).join(' · ');
      if(tags.length) l1 += ` <span class="pop-tag">${tags.join(' · ')}</span>`;
      statHtml += stat(l1);
      if(data.atk){ const L={physical:'Физ',magic:'Маг',fire:'Огн',lightning:'Молн',holy:'Свят'}, a=[]; ['physical','magic','fire','lightning','holy'].forEach(k=>{ if(data.atk[k]) a.push(`${L[k]} <b>${data.atk[k]}</b>`); }); if(a.length) statHtml += stat('Атака: '+a.join(' · ')); }
      if(data.scl){ const L={str:'Сил',dex:'Лов',int:'Мдр',fai:'Вер',arc:'Клд'}, s=[]; ['str','dex','int','fai','arc'].forEach(k=>{ if(data.scl[k]) s.push(`${L[k]} <b>${data.scl[k]}</b>`); }); if(s.length) statHtml += stat('Бонусы: '+s.join(' · ')); }
      if(data.req) statHtml += stat('Треб.: '+data.req);
    } else if(catId==='armor'){
      statHtml += stat([data.wt!=null?('Вес '+wt(data.wt)):null, data.poise?('Баланс '+data.poise):null].filter(Boolean).join(' · '));
      if(data.neg){ const n=data.neg, cells=[['Физ',n.ph],['Дроб',n.st],['Руб',n.sl],['Кол',n.pi],['Маг',n.ma],['Огн',n.fi],['Молн',n.li],['Свят',n.ho]].map(c=>`<div>${c[0]}<b>${c[1]}</b></div>`).join(''); statHtml += `<div class="pop-grid">${cells}</div>`; }
      if(data.res){ const r=data.res; statHtml += stat(`Иммунитет <b>${r.im}</b> · Стойкость <b>${r.ro}</b> · Конц. <b>${r.fo}</b> · Живучесть <b>${r.de}</b>`); }
    } else {
      const r = [];
      if(catId==='spell'){ if(data.t) r.push(data.t); if(data.fp!=null) r.push(data.fp+' ОК'); if(data.slots) r.push('Ячеек: '+data.slots); if(data.req) r.push(data.req); }
      else if(catId==='spirit'){ if(data.fp!=null) r.push(data.fp+' ОК'); if(data.hp) r.push(data.hp+' ОЗ'); if(data.mat) r.push('Улучшение: '+data.mat); }
      else if(catId==='ash'){ if(data.aff) r.push('Свойство: '+data.aff); }
      else if(catId==='talisman'){ if(data.wt!=null) r.push('Вес '+wt(data.wt)); }
      else if(catId==='boss'){ if(data.runes) r.push(Number(data.runes).toLocaleString()+' рун'); }
      const s = r.filter(Boolean).join(' · ');
      if(s) statHtml += stat(s);
    }
    if(data.sum) sumHtml = `<div class="pop-sum">${data.sum}</div>`;
  }
  return { iconHtml, statHtml, sumHtml };
}
const COLLECTIBLE_CATS = { weapon:1, armor:1, talisman:1, spell:1, ash:1, spirit:1, tear:1, golden:1, larval:1, memory:1, crystal:1, greatrune:1, whetblade:1, scadutree:1, revered:1 };

function popupHtml(d, cat){
  const autoOn = !!(window.COOP_AUTO && window.COOP_AUTO.isMarkerFound(d.id));
  const on = isMarkerFound(d.id);
  const m = itemMeta(d, cat.id);

  let bossHtml = "";
  if(cat.id==='boss'){
    const bi = bossInfo(d.en || d.name);
    const drops = (window.BOSS_DROPS_BY_ID && window.BOSS_DROPS_BY_ID[d.id]) || (bi && bi.drops);
    if(drops) bossHtml += `<div class="pop-stat pop-drops">🎁 <b>Награда:</b> ${drops}</div>`;
    if(bi){
      if(bi.deals && bi.deals.length) bossHtml += `<div class="pop-stat pop-deals"><b>Урон</b> ${dmgChips(bi.deals)}</div>`;
      if(bi.weak && bi.weak.length) bossHtml += `<div class="pop-stat pop-weak"><b>Уязвимость</b> ${dmgChips(bi.weak)}</div>`;
      if(bi.resist && bi.resist.length) bossHtml += `<div class="pop-stat pop-resist"><b>Сопротивление</b> ${dmgChips(bi.resist)}</div>`;
      if(bi.note) bossHtml += `<div class="pop-sum">🛡 ${bi.note}</div>`;
    }
  }
  const npcInfo = (cat.id==='npc' && window.COOP_AUTO && window.COOP_AUTO.getActiveNpc) ? window.COOP_AUTO.getActiveNpc(d.id) : null;
  const npcBadge = npcInfo ? (NPC_STATUS_HTML[npcInfo.status] || "") : "";
  const npcStageHtml = npcInfo ? `<div class="pop-stat pop-npc-stage">🧭 <b>Текущий этап:</b> ${npcInfo.stage}</div>` : "";
  const questBtnHtml = (npcInfo && npcInfo.quest_id) ? `<button type="button" class="pop-quest-btn" data-qid="${npcInfo.quest_id}">📜 Квест</button>` : "";
  const condHtml = d.cond ? `<div class="pop-stat pop-cond">🌙 Условие появления: <b>${d.cond}</b></div>` : "";
  const fallbackDesc = (cat.id === 'boss' && !m.statHtml && d.desc) ? `<div class="pop-stat">🪙 <b>${d.desc}</b></div>` : "";
  const descHtml = (d.desc && cat.id !== 'boss')
    ? (COLLECTIBLE_CATS[cat.id] ? `<div class="pop-d pop-hint">📍 <b>Как получить:</b> ${d.desc}</div>` : `<div class="pop-d">${d.desc}</div>`)
    : "";
  return `
    <div class="pop-head">${m.iconHtml}
      <div class="pop-head-t">
        <div class="pop-cat">${cat.icon} ${cat.name}${autoOn ? '<span class="auto-badge">⚡ .co2</span>' : ''}${npcBadge}</div>
        <div class="pop-t">${d.name}</div>
      </div>
    </div>
    ${m.statHtml}${fallbackDesc}${condHtml}${npcStageHtml}${m.sumHtml}${bossHtml}
    ${descHtml}
    <div class="pop-actions">
      <div class="pop-found ${on?'on':''}" data-id="${d.id}"><span>${on?'✓':'○'}</span><span>${autoOn ? 'Открыто в .co2' : (on?'Найдено':'Отметить найденным')}</span></div>
      ${questBtnHtml}
      <a class="pop-wiki" href="${wiki}" target="_blank" rel="noopener">Wiki ↗</a>
    </div>`;
}
function bindPopup(d, cat, m){
  const qbtn = document.querySelector('.pop-quest-btn[data-qid]');
  if(qbtn) qbtn.onclick = () => {
    const qid = qbtn.dataset.qid;
    const q = (typeof QL !== "undefined") ? QL.find(x => x.id === qid) : null;
    if(q){ openQuestPanel(q); m.closePopup(); }
  };
  const el = document.querySelector(`.pop-found[data-id="${d.id}"]`);
  if(!el) return;
  el.onclick = () => {
    if(found[d.id]) delete found[d.id]; else found[d.id]=1;
    saveFound();
    const ref = markerRefs.find(r=>r.data.id===d.id);
    ref.marker.setIcon(divIcon(cat, isMarkerFound(d.id), d));
    m.setPopupContent(popupHtml(d,cat));
    bindPopup(d,cat,m);
    refreshCounts();
    if(hideFound) rebuildCluster();
  };
}

function renderMapChips(){

    ? QL.filter(q => questState[q.id]).length

function renderRegionPanel(){
  const rp = document.getElementById("regionPanel");
  const strip = document.getElementById("regActiveStrip");
  if(strip){
    strip.innerHTML = activeRegion
      ? `<span>Фильтр: <b>${activeRegion}</b></span><button type="button" class="reg-chip" id="regClearBtn" title="Сбросить фильтр региона">Сбросить ✕</button>`

  const baseMarkers = MARKERS.filter(m => m.master === activeBase && (m.cat === "grace" || m.cat === "boss"));
  const byReg = {};
  baseMarkers.forEach(m => { if(m.reg) (byReg[m.reg] ||= []).push(m); });
  rp.innerHTML = order.map(reg => {
    const arr = byReg[reg] || [];
    if(!arr.length) return "";
    const gr = arr.filter(m => m.cat === "grace");
    const bs = arr.filter(m => m.cat === "boss");
    const gDone = gr.filter(m => isMarkerFound(m.id)).length;
    const bDone = bs.filter(m => isMarkerFound(m.id)).length;
    const t = gr.length + bs.length;
    const d = gDone + bDone;
    const pct = t ? Math.round(d / t * 100) : 0;
    const cls = ["reg-row", reg === activeRegion ? "active" : "", (t > 0 && d === t) ? "done" : ""].filter(Boolean).join(" ");
    return `<div class="${cls}" data-reg="${reg}">` +
      `<div class="reg-row-top"><span class="reg-nm">${reg}</span><span class="reg-pct">${pct}%</span></div>` +
      `<div class="reg-bar"><div style="width:${pct}%"></div></div>` +
      `<div class="reg-meta">🔥 ${gDone}/${gr.length} · 💀 ${bDone}/${bs.length}</div>` +
      `</div>`;
  }).join("");
  rp.querySelectorAll(".reg-row").forEach(el => {
    el.onclick = () => selectRegion(el.dataset.reg);
  });
}

function rebuildCluster(){
  const dynNpc = isDynamicNpcMode();
  const active = markerRefs.filter(r =>
    !r.isRegion &&
    catState[r.cat.id] &&
    r.master === activeBase &&
    (!activeRegion || r.data.reg === activeRegion) &&
    !(hideFound && isMarkerFound(r.data.id)) &&
    !(dynNpc && r.cat.id === "npc" && !window.COOP_AUTO.getActiveNpc(r.data.id))
  );
  const clustered = active.filter(r => !UNCLUSTERED_CATS[r.cat.id]).map(r => r.marker);
  const direct = active.filter(r => UNCLUSTERED_CATS[r.cat.id]).map(r => r.marker);
  cluster.clearLayers();
  cluster.addLayers(clustered);
  directLayer.clearLayers();
  direct.forEach(mk => directLayer.addLayer(mk));
  rebuildRegions();
  renderMapChips();
  savePrefs();
}
function rebuildRegions(){
  regionLayer.clearLayers();
  if(!catState["region"]) return;
  markerRefs.forEach(r => { if(r.isRegion && r.master === activeBase) regionLayer.addLayer(r.marker); });
}
// Region labels fade in & non-clustered pins scale smoothly by zoom level.
function updateZoomVisuals(){
  const z = map.getZoom();
  const op = (Math.max(0, Math.min(1, (z - 2.4) / 1.0)) * 0.92).toFixed(2);
  const pinScale = z <= 1.5 ? 0.65 : (z <= 2.5 ? 0.78 : (z <= 3.5 ? 0.90 : (z <= 5.0 ? 1.00 : 1.10)));
  const mapEl = document.getElementById("map");
  mapEl.style.setProperty("--rl-op", op);

function refreshCounts(){
  const dynNpc = isDynamicNpcMode();
  CATEGORIES.forEach(cat => {
    const inBase = MARKERS.filter(m => m.cat===cat.id && m.master===activeBase && (!activeRegion || m.reg===activeRegion));

    const done = (cat.id === "npc" && dynNpc)
      ? inBase.filter(m => !!window.COOP_AUTO.getActiveNpc(m.id)).length
      : inBase.filter(m => isMarkerFound(m.id)).length;

    if(el) el.innerHTML = total ? `<b>${done}</b>/${total}` : "";
    const row = document.querySelector(`.cat[data-cat="${cat.id}"]`);
    if(row) row.style.display = total ? "" : "none";
  });
  const prog = MARKERS.filter(m => m.master===activeBase && (m.cat==='grace' || m.cat==='boss') && (!activeRegion || m.reg===activeRegion));
  const gr = prog.filter(m => m.cat==='grace');
  const bs = prog.filter(m => m.cat==='boss');
  const gDone = gr.filter(m => isMarkerFound(m.id)).length;
  const bDone = bs.filter(m => isMarkerFound(m.id)).length;
  const t = prog.length, d = gDone + bDone, p = t ? Math.round(d/t*100) : 0;

  if(dashTitle) dashTitle.textContent = activeRegion ? `Прогресс · ${activeRegion}` : "Прогресс";
  document.getElementById("dashFill").style.width = p + "%";
  document.getElementById("dashPct").textContent = p + "%";
  document.getElementById("dashSub").textContent = `🔥 ${gDone}/${gr.length} · 💀 ${bDone}/${bs.length}`;
  renderRegionPanel();
}

  if(p){

    if(p.hf){ hideFound=true; document.getElementById("hideFound").classList.add("active"); }
    if(p.npcMode === "all" || p.npcMode === "dynamic") npcMode = p.npcMode;
    if(["markers","quests","regions"].includes(p.sbTab)) activeSbTab = p.sbTab;
    if(["all","active","todo","done"].includes(p.qf)) questFilter = p.qf;
    if(p.base && p.base!==activeBase && baseLayers[p.base]) switchBase(p.base);
  }
  syncNpcModeBtn();

  const h = location.hash.replace(/^#/,"").split("/");

/* ---- Search: live results dropdown across all 3 maps + fly-to ---- */
const resultsEl = document.getElementById("results");
function renderResults(){
  const q = searchEl.value.trim().toLowerCase();
  if(!q){ resultsEl.style.display="none"; resultsEl.innerHTML=""; return; }
  const matches = MARKERS.filter(m => m.cat !== "region" &&
    (m.name.toLowerCase().includes(q) || (m.en||"").toLowerCase().includes(q) || (m.desc||"").toLowerCase().includes(q)))
    .sort((a,b) => (a.master===activeBase ? 0 : 1) - (b.master===activeBase ? 0 : 1))
    .slice(0,18);
  resultsEl.style.display="block";
  if(!matches.length){ resultsEl.innerHTML='<div class="res-empty">Ничего не найдено</div>'; return; }
  resultsEl.innerHTML="";
  matches.forEach(d => {
    const cat = catById[d.cat];
    if(!cat) return;
    const item = document.createElement("div"); item.className="res";
    const mapBadge = d.master !== activeBase ? `<span class="res-map">${baseLabel(d.master)}</span>` : "";
    item.innerHTML = `<span class="res-ic" style="background:${cat.color}">${cat.icon}</span>`+
      `<span class="res-nm">${d.name}</span>${mapBadge}<span class="res-cat">${cat.name}</span>`;
    item.onmousedown = (e) => {            // mousedown fires before the input's blur
      e.preventDefault();
      if(d.master !== activeBase) switchBase(d.master);
      if(activeRegion && d.reg !== activeRegion){ activeRegion = null; refreshCounts(); rebuildCluster(); }
      if(!catState[cat.id]){ catState[cat.id]=true; const row=document.querySelector(`.cat[data-cat="${cat.id}"]`); if(row) row.classList.remove("off"); rebuildCluster(); }
      resultsEl.style.display="none"; searchEl.value=d.name;
      const r = markerRefs.find(x => x.data.id === d.id);
      if(!r) return;
      if (UNCLUSTERED_CATS[cat.id]) {
        map.flyTo(r.marker.getLatLng(), Math.max(map.getZoom(), NZ - 1), { duration: 0.45 });
        setTimeout(() => r.marker.openPopup(), 320);
      } else {

      }

    resultsEl.appendChild(item);
  });
}

/* ---- Hover region badge (nearest grace region on active map) ---- */
const GRACES_BY_BASE = { M00: [], M01: [], M10: [] };
MARKERS.forEach(m => { if(m.cat === "grace" && m.reg && GRACES_BY_BASE[m.master]) GRACES_BY_BASE[m.master].push(m); });
const coordEl = document.getElementById("coord");
map.on("mousemove", e => {
  const [px, py] = fromLatLng(e.latlng);
  if(px < 0 || py < 0 || px > CONFIG.imgSize || py > CONFIG.imgSize){ coordEl.textContent = ""; return; }
  const grs = GRACES_BY_BASE[activeBase] || [];
  let best = null, bestD2 = Infinity;
  for(let i = 0; i < grs.length; i++){
    const dx = px - grs[i].px, dy = py - grs[i].py, d2 = dx*dx + dy*dy;
    if(d2 < bestD2){ bestD2 = d2; best = grs[i]; }
  }
  coordEl.textContent = (best && bestD2 <= 1600 * 1600) ? `🗺 ${best.reg}` : "";
});
map.on("mouseout", () => { coordEl.textContent = ""; });

/* ============================================================
   QUESTLINES — ordered, numbered step pins + connecting path.
   Each questline toggles independently; steps show on the layer
   (overworld/underground) they belong to.
   ============================================================ */

/* ---- quest progress (localStorage) ---- */
const QSAVE_KEY = "er-map-quests-v1";
let qsave = (function(){ try{ return JSON.parse(localStorage.getItem(QSAVE_KEY)) || {shown:{},done:{},override:{}}; }catch(e){ return {shown:{},done:{},override:{}}; } })();
qsave.shown = qsave.shown || {}; qsave.done = qsave.done || {}; qsave.override = qsave.override || {};
function saveQuests(){ try{ localStorage.setItem(QSAVE_KEY, JSON.stringify(qsave)); }catch(e){} }
function isDone(id,n){
  if (qsave.override[id] && Object.prototype.hasOwnProperty.call(qsave.override[id], n)) {
    return !!qsave.override[id][n];
  }
  return !!((qsave.done[id] && qsave.done[id][n]) || (window.COOP_AUTO && window.COOP_AUTO.isStepDone(id, n)));
}
function qProgress(q){ return { t:q.steps.length, d:q.steps.filter(s=>isDone(q.id,s.n)).length }; }
function currentN(q){ const s = q.steps.find(s=>!isDone(q.id,s.n)); return s ? s.n : 0; }   // first incomplete step
function baseLabel(m){ return m==='M01'?'Подземелья':(m==='M10'?'Земли Теней':'Междуземье'); }
const KIND = { item:"📦 Предмет", boss:"💀 Босс", npc:"🧙 NPC", grace:"📍 Место" };

function qIcon(color, n, st){
  const bg = st.done ? "#39414f" : (st.start ? "#e5484d" : color);
  const sz = st.start ? 28 : 22;
  const cls = ["qpin"]; if(st.start)cls.push("start"); if(st.done)cls.push("done"); if(st.current)cls.push("current"); if(st.warn)cls.push("warn");
  return L.divIcon({
    html: `<div class="${cls.join(' ')}" style="background:${bg};width:${sz}px;height:${sz}px"><span>${st.done?'✓':n}</span></div>`,
    className:"", iconSize:[sz,sz], iconAnchor:[sz/2, sz-2], popupAnchor:[0,-(sz-4)],
  });
}
function stepPopup(q, s){
  const done = isDone(q.id, s.n), start = s.n===1;
  return `<div class="pop-cat" style="color:${start?'#e5484d':q.color}">${start?'▶ НАЧАЛО · ':''}${q.name}</div>`+
    `<div class="pop-t">Шаг ${s.n}: ${s.title}</div>`+
    (s.warn ? `<div class="pop-warn">⚠ ${s.warn}</div>` : "")+
    (s.desc ? `<div class="pop-d">${s.desc}</div>` : "")+
    `<div style="font-size:11px;color:var(--muted);margin:6px 0">${KIND[s.kind]||""}</div>`+
    `<div class="pop-found ${done?'on':''}" data-qd="${q.id}#${s.n}"><span>${done?'✓':'○'}</span><span>${done?'Шаг выполнен':'Отметить выполненным'}</span></div>`;
}
function renderQuest(q){
  if (questLayers[q.id]) {
    map.removeLayer(questLayers[q.id]);
    delete questLayers[q.id];
  }
  q.steps.forEach(s => { delete stepMarkers[q.id + '#' + s.n]; });
  if (!questState[q.id]) return;
  const steps = q.steps.filter(s => s.master === activeBase);
  const visSteps = hideFound ? steps.filter(s => !isDone(q.id, s.n)) : steps;
  const lg = L.layerGroup();
  if (visSteps.length > 1){
    L.polyline(visSteps.map(s => xy(s.px, s.py)), { color:q.color, weight:2.5, opacity:.6, dashArray:"5,6" }).addTo(lg);
  }
  const cur = currentN(q);
  visSteps.forEach(s => {
    const st = { start:s.n===1, done:isDone(q.id,s.n), current:s.n===cur, warn:!!s.warn };
    const mk = L.marker(xy(s.px, s.py), { icon: qIcon(q.color, s.n, st), title:`${s.n}. ${s.title}`, zIndexOffset: st.current?3000:(st.start?2000:1000) });
    mk.bindPopup(() => stepPopup(q, s), { minWidth:230 });
    mk.on("popupopen", () => bindStepPopup(q, s, mk));
    mk.addTo(lg);
    stepMarkers[q.id+'#'+s.n] = mk;
  });
  lg.addTo(map);
  questLayers[q.id] = lg;
}
function bindStepPopup(q, s, mk){
  const el = document.querySelector(`.pop-found[data-qd="${q.id}#${s.n}"]`);
  if(el) el.onclick = () => { toggleStepDone(q, s.n); mk.setPopupContent(stepPopup(q,s)); bindStepPopup(q,s,mk); };
}
function toggleStepDone(q, n){
  const curDone = isDone(q.id, n);
  const targetDone = !curDone;
  const autoDone = !!(window.COOP_AUTO && window.COOP_AUTO.isStepDone(q.id, n));
  if (qsave.done[q.id]) delete qsave.done[q.id][n];
  if (targetDone === autoDone) {
    if (qsave.override[q.id]) delete qsave.override[q.id][n];
  } else {
    (qsave.override[q.id] ||= {})[n] = targetDone;
  }
  saveQuests();
  renderQuest(q); updateQuestRow(q);
  if (typeof refreshQuestList === "function") refreshQuestList();
  if(panelQuest && panelQuest.id===q.id) fillPanel(q);
}
function renderActiveQuests(){
  QL.forEach(q => renderQuest(q));
  renderMapChips();
}
function hideAllQuests(){
  QL.forEach(q => {
    questState[q.id] = false;
    delete qsave.shown[q.id];
    updateQuestRow(q);
  });
  saveQuests();
  closeQuestPanel();
  renderActiveQuests();
}

/* ---- quest detail panel ---- */
const qPanel = document.getElementById("questPanel");
let qFont = parseFloat(localStorage.getItem("er-qfs")) || 1.15;
function setQuestFont(v){ qFont = Math.min(1.8, Math.max(0.8, Math.round(v*20)/20)); localStorage.setItem("er-qfs", qFont); qPanel.style.setProperty("--qfs", qFont); }
let qpW = parseInt(localStorage.getItem("er-qpw")) || 0;
let _lastPanelId = null;
function openQuestPanel(q){
  panelQuest = q;
  if(!questState[q.id]){ questState[q.id]=true; qsave.shown[q.id]=1; saveQuests(); renderQuest(q); }
  qPanel.style.setProperty("--qfs", qFont);
  qPanel.style.width = (!window.matchMedia("(max-width:640px)").matches && qpW) ? qpW+"px" : "";
  updateQuestRow(q); fillPanel(q); qPanel.classList.add("open");
  renderMapChips();
  if (window.matchMedia("(max-width:640px)").matches) document.getElementById("app").classList.add("sb-collapsed");  // give the panel + map room on phones
}
function closeQuestPanel(){ qPanel.classList.remove("open"); panelQuest=null; }
function fillPanel(q){
  const _stPrev = qPanel.querySelector(".qp-steps");
  const _scrollTop = (_lastPanelId === q.id && _stPrev) ? _stPrev.scrollTop : 0;   // keep scroll on same-quest re-render; reset for a new quest
  _lastPanelId = q.id;
  const {t,d} = qProgress(q), pct = t ? Math.round(d/t*100) : 0, cur = currentN(q);
  const visibleSteps = hideFound ? q.steps.filter(s => !isDone(q.id, s.n)) : q.steps;
  const hiddenCnt = q.steps.length - visibleSteps.length;
  const hiddenNote = (hideFound && hiddenCnt > 0)
    ? `<div class="qp-hidden-note">${visibleSteps.length ? `Скрыто выполненных шагов: <b>${hiddenCnt}</b> (фильтр «Скрыть найденное»)` : "✓ Все шаги квеста выполнены"}</div>`
    : "";
  const rows = visibleSteps.map(s => {
    const done = isDone(q.id,s.n), isCur = s.n===cur, other = s.master!==activeBase;
    const reason = window.COOP_AUTO ? window.COOP_AUTO.getStepReason(q.id, s.n) : null;
    const badge = (done && reason)
      ? `<span class="auto-badge ${reason.kind==='inferred'?'inferred':''}" title="${reason.text}">${reason.kind==='inferred'?'↳ Авто':'⚡ .co2'}</span>`
      : ((!done && reason) ? `<span class="auto-badge" style="color:var(--muted);border-color:var(--line);background:transparent" title="Автоотметка .co2 отключена вручную">✕ вручную</span>` : '');
    return `<div class="qs-row ${done?'done':''} ${isCur?'cur':''}" data-n="${s.n}">`+
      `<div class="qs-chk ${done?'on':''}" data-chk="${s.n}">${done?'✓':''}</div>`+
      `<div class="qs-num" style="background:${s.n===1?'#e5484d':q.color}">${s.n}</div>`+
      `<div class="qs-body"><div class="qs-t">${s.title}${badge}${s.warn?' <span class="qs-warn">⚠</span>':''}</div>`+
        (s.desc?`<div class="qs-desc">${s.desc}</div>`:'')+
        (s.reward?`<div class="qs-reward">🎁 ${s.reward}</div>`:'')+
        (s.warn?`<div class="qs-warntext">${s.warn}</div>`:'')+`</div>`+
      (other?`<span class="qs-layer">${baseLabel(s.master)}</span>`:'')+`</div>`;
  }).join("");
  const npcSt = window.COOP_AUTO ? window.COOP_AUTO.getNpcStatus(q.id) : 'unknown';
  const npcBadge = npcSt==='hostile' ? '<span class="npc-badge hostile" title="Можно искупить грех в Храме Клятв">⚔ Враждебен</span>' : (npcSt==='dead' ? '<span class="npc-badge dead">💀 Погиб</span>' : '');
  qPanel.innerHTML =
    `<div class="qp-resize" id="qpResize"></div><div class="qp-head"><div class="qp-title"><span class="qp-dot" style="background:${q.color}"></span>${q.name}${npcBadge}</div><div class="qp-tools"><div class="qp-unpin" id="qpHideMap" title="Скрыть маркеры этого квеста с карты и закрыть панель">Снять с карты</div><div class="qp-fs" id="qpFsDn" title="Уменьшить шрифт">A−</div><div class="qp-fs" id="qpFsUp" title="Увеличить шрифт">A+</div><div class="qp-x" id="qpX">✕</div></div></div>`+
    `<div class="qp-prog"><div class="qp-prog-top"><span>${d} / ${t} шагов выполнено</span><b>${pct}%</b></div><div class="dash-bar"><div style="width:${pct}%"></div></div></div>`+
    `<div class="qp-steps">`+
      (q.overview?`<div class="qp-notes"><div class="qp-notes-h">Обзор квеста</div>${q.overview}${q.prereq?`<div class="qp-prereq">⚑ ${q.prereq}</div>`:''}</div>`:'')+
      `${hiddenNote}${rows}</div>`;
  document.getElementById("qpX").onclick = closeQuestPanel;
  document.getElementById("qpHideMap").onclick = () => {
    questState[q.id] = false;
    delete qsave.shown[q.id];
    saveQuests();
    renderQuest(q);
    updateQuestRow(q);
    renderMapChips();
    closeQuestPanel();
  };
  document.getElementById("qpFsUp").onclick = e => { e.stopPropagation(); setQuestFont(qFont+0.1); };
  document.getElementById("qpFsDn").onclick = e => { e.stopPropagation(); setQuestFont(qFont-0.1); };
  const qpr = document.getElementById("qpResize");
  if(qpr) qpr.onmousedown = e => {
    e.preventDefault();
    const startX = e.clientX, startW = qPanel.offsetWidth;
    document.body.style.userSelect = "none";
    const mv = ev => { qPanel.style.width = Math.min(640, Math.max(260, startW + (startX - ev.clientX))) + "px"; };
    const up = () => { document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up); document.body.style.userSelect=""; qpW = qPanel.offsetWidth; localStorage.setItem("er-qpw", qpW); };
    document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
  };
  qPanel.querySelectorAll(".qs-row").forEach(row => {
    const n = +row.dataset.n, s = q.steps.find(x=>x.n===n);
    row.querySelector(".qs-chk").onclick = (e) => { e.stopPropagation(); toggleStepDone(q, n); };
    row.onclick = () => flyToStep(q, s);
  });
  const _stNew = qPanel.querySelector(".qp-steps"); if(_stNew) _stNew.scrollTop = _scrollTop;
}
function flyToStep(q, s){
  if(s.master!==activeBase) switchBase(s.master);   // jump to the layer the step lives on
  if(!questState[q.id]){ questState[q.id]=true; renderQuest(q); }
  map.flyTo(xy(s.px, s.py), Math.max(map.getZoom(), NZ-1), { duration:.6 });
  const mk = stepMarkers[q.id+'#'+s.n];
  if(mk) setTimeout(() => mk.openPopup(), 380);
  fillPanel(q);
}

/* ---- sidebar quest list ---- */
function updateQuestRow(q){
  const row = document.querySelector(`.quest-row[data-q="${q.id}"]`);
  if(!row) return;
  row.classList.toggle("off", !questState[q.id]);
  const {t,d} = qProgress(q);
  const npcSt = window.COOP_AUTO ? window.COOP_AUTO.getNpcStatus(q.id) : 'unknown';
  const badge = npcSt==='hostile' ? '<span class="npc-badge hostile">⚔</span>' : (npcSt==='dead' ? '<span class="npc-badge dead">💀</span>' : '');
  const ct = row.querySelector(".ct"); if(ct) ct.innerHTML = `${badge} ` + (d ? `<b>${d}</b>/${t}` : `${t}`);
}
function toggleQuest(id){
  const q = QL.find(x=>x.id===id);
  if(questState[id] && !(panelQuest && panelQuest.id===id)){ openQuestPanel(q); return; }   // shown but panel closed -> reopen panel
  questState[id] = !questState[id];
  if(questState[id]) qsave.shown[id]=1; else delete qsave.shown[id];
  saveQuests();
  updateQuestRow(q); renderQuest(q); renderMapChips();
  if(questState[id]) openQuestPanel(q); else if(panelQuest && panelQuest.id===id) closeQuestPanel();
}

function refreshQuestList(){
  const counts = { all: QL.length, active: 0, todo: 0, done: 0 };
  const phaseVis = {};
  QL.forEach(q => {
    const { t, d } = qProgress(q);
    const status = (t > 0 && d === t) ? "done" : (d > 0 ? "active" : "todo");
    counts[status]++;
    const show = (questFilter === "all" || status === questFilter) && !(hideFound && questFilter === "all" && status === "done");
    const row = document.querySelector(`.quest-row[data-q="${q.id}"]`);
    if(row) row.style.display = show ? "" : "none";
    const ph = String(q.phase || "");
    if(show) phaseVis[ph] = (phaseVis[ph] || 0) + 1;
  });
  document.querySelectorAll(".qphase-h").forEach(h => {
    h.style.display = phaseVis[h.dataset.qphase] ? "" : "none";
  });
  ["all", "active", "todo", "done"].forEach(k => {
    const ce = document.getElementById("qfc-" + k);
    if(ce) ce.textContent = String(counts[k]);
  });
  document.querySelectorAll(".qfilter-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.qf === questFilter);
  });
}

const sbQuestCtEl = document.getElementById("sbQuestCt");
if(sbQuestCtEl) sbQuestCtEl.textContent = QL.length ? String(QL.length) : "";
const questCatsEl = document.getElementById("questCats") || catsEl;

if (QL.length){
  const PHASES = { 1:"① Замогилье и Крепость Круглого стола", 2:"② Плачущий полуостров → Грозовая Завеса", 3:"③ Лиурния Озёрная", 4:"④ Звёздные пустоши → Альтус → Поместье", 5:"⑤ Земли Теней (DLC)" };
  const gEl = document.createElement("div");
  const qt = document.createElement("div");
  qt.className = "qtools";
  qt.innerHTML =
    `<div class="qtools-head"><span>Цепочки (${QL.length})</span><span class="qtools-acts">` +
      `<button type="button" class="qtools-act" id="qShowActive" title="Показать на карте все начатые и незавершённые квесты">Показать активные</button>` +
      `<button type="button" class="qtools-act" id="qHideAll" title="Скрыть все квесты с карты">Скрыть все</button>` +
    `</span></div>` +
    `<div class="qfilter-row">` +
      `<button type="button" class="qfilter-btn active" data-qf="all">Все <span id="qfc-all">${QL.length}</span></button>` +
      `<button type="button" class="qfilter-btn" data-qf="active">В процессе <span id="qfc-active">0</span></button>` +
      `<button type="button" class="qfilter-btn" data-qf="todo">Не начаты <span id="qfc-todo">0</span></button>` +
      `<button type="button" class="qfilter-btn" data-qf="done">Завершены <span id="qfc-done">0</span></button>` +
    `</div>`;
  gEl.appendChild(qt);

  let curPhase = null;
  QL.slice().sort((a,b)=>((a.phase||99)-(b.phase||99))||((a.ord||999)-(b.ord||999))).forEach(q => {   // sidebar follows phase & recommended completion order
    questState[q.id] = false;
    if(q.phase !== curPhase){
      curPhase = q.phase;
      const h = document.createElement("div"); h.className="group-h qphase-h"; h.dataset.qphase=String(q.phase); h.textContent = PHASES[q.phase] || "Квесты";
      gEl.appendChild(h);
    }
    const row = document.createElement("div");
    row.className = "cat quest-row off"; row.dataset.q = q.id; row.dataset.qphase = String(q.phase);
    row.innerHTML = `<div class="dot" style="background:${q.color}"></div>
      <div class="nm">${q.name}</div><div class="ct">${q.steps.length}</div>`;
    row.onclick = () => toggleQuest(q.id);
    gEl.appendChild(row);
  });
  questCatsEl.appendChild(gEl);

  qt.querySelectorAll(".qfilter-btn").forEach(btn => {
    btn.onclick = () => {
      questFilter = btn.dataset.qf;
      refreshQuestList();
      savePrefs();
    };
  });
  const btnShowActive = document.getElementById("qShowActive");
  if(btnShowActive) btnShowActive.onclick = () => {
    QL.forEach(q => {
      const { t, d } = qProgress(q);
      const on = d > 0 && d < t;
      questState[q.id] = on;
      if(on) qsave.shown[q.id] = 1; else delete qsave.shown[q.id];
      updateQuestRow(q);
    });
    saveQuests();
    renderActiveQuests();
  };
  const btnHideAll = document.getElementById("qHideAll");
  if(btnHideAll) btnHideAll.onclick = hideAllQuests;

  QL.forEach(q => { if(qsave.shown[q.id]) questState[q.id] = true; updateQuestRow(q); });   // restore saved visibility + progress
  renderActiveQuests();
  refreshQuestList();
}

/* Restore saved filters + shared view last, once everything (incl. quests) is initialized. */
restoreState();
</script>
<script src="coop-sync.js"></script>
</body>
</html>
